<style>
/* Layout: 商品展示台——上方大舞台放罐子，下方一列面向切換與說明；桌機左右並排 */
:root {
  --bg: #f3ece2;
  --surface: #fbf7f1;
  --ink: #2a1a14;
  --muted: #76625a;
  --line: #e0d3c3;
  --accent: #a3231b;
  --accent-ink: #fff8f0;
  --stage-top: #f7efe4;
  --stage-bottom: #e4d4bf;
  --font-display: "Noto Serif TC", "Songti TC", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1210; --surface: #241917; --ink: #f2e6da; --muted: #b9a497; --line: #3a2b26;
    --accent: #e0574a; --accent-ink: #1a0d0a; --stage-top: #2a1d19; --stage-bottom: #120c0a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1210; --surface: #241917; --ink: #f2e6da; --muted: #b9a497; --line: #3a2b26;
  --accent: #e0574a; --accent-ink: #1a0d0a; --stage-top: #2a1d19; --stage-bottom: #120c0a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
@media (min-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; } header { grid-column: 1 / -1; } }
header { display: grid; gap: 2px; }
.brand { color: var(--muted); font-size: 0.82rem; letter-spacing: 0.15em; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.6rem, 5vw, 2.3rem); margin: 0; line-height: 1.2; text-wrap: balance; }
h1 small { font-size: 0.55em; color: var(--accent); margin-left: 0.4em; }

.stage {
  position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 50% 20%, var(--stage-top), var(--stage-bottom));
  aspect-ratio: 4 / 5; max-width: 100%; max-height: 78vh; width: 100%;
}
@media (min-width: 900px) { .stage { aspect-ratio: auto; height: min(78vh, 720px); } }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.tip { position: absolute; left: 12px; bottom: 12px; font-size: 0.78rem; color: var(--muted); pointer-events: none; }
.spin { position: absolute; right: 12px; top: 12px; }

aside { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
h2 { margin: 0; font-size: 0.78rem; letter-spacing: 0.14em; color: var(--muted); font-weight: 700; }
.faces { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
button {
  font: inherit; font-size: 0.88rem; font-weight: 500; cursor: pointer; min-height: 40px; padding: 6px 10px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 0.9rem; }
dt { color: var(--muted); }
dd { margin: 0; }
.note { font-size: 0.8rem; color: var(--muted); margin: 0; }
.note b { color: var(--ink); font-weight: 500; }
</style>

<div class="wrap">
  <header>
    <span class="brand">米樂家食材</span>
    <h1>滿福果仁辣醬<small>純素｜香麻小辣</small></h1>
  </header>

  <div class="stage" id="stage">
    <canvas id="c" aria-label="滿福果仁辣醬 3D 模型，可拖曳旋轉、雙指縮放"></canvas>
    <button class="spin" id="btnSpin" aria-pressed="true">自動旋轉</button>
    <span class="tip">拖曳旋轉・雙指或滾輪縮放</span>
  </div>

  <aside>
    <section class="card">
      <h2>轉到這一面</h2>
      <div class="faces">
        <button data-face="5">成分</button>
        <button data-face="0" aria-pressed="true">正面</button>
        <button data-face="1">營養標示</button>
      </div>
    </section>
    <section class="card">
      <h2>商品資訊</h2>
      <dl>
        <dt>淨重</dt><dd>250 公克</dd>
        <dt>口味</dt><dd>純素・香麻小辣</dd>
        <dt>果仁</dt><dd>松子、腰果、杏仁、花生、白芝麻、葵瓜子</dd>
        <dt>怎麼吃</dt><dd>拌麵、拌飯、拌豆腐、燙青菜、火鍋沾醬</dd>
      </dl>
    </section>
    <section class="card">
      <h2>製作說明</h2>
      <p class="note">標籤直接取自商品照片，正面、成分、營養標示三面文字與原圖一致。<b>背後三面照片拍不到</b>，暫時以米樂家標誌與素面代替，提供標籤原始設計檔即可補上。</p>
    </section>
  </aside>
</div>

const stage = document.getElementById("stage"), canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 3.2;
controls.maxDistance = 12;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.6;

const loader = new THREE.TextureLoader();
const tex = (src) => { const t = loader.load(src); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; };

// ---- 尺寸（單位＝一個面的寬度，比例量自商品照） ----
const R = 1;                        // 六角外接半徑＝面寬
const APO = R * Math.sqrt(3) / 2;   // 中心到面的距離
const BODY_H = 2.09, LABEL_H = 1.59, LABEL_Y = 0.23 + LABEL_H / 2;
const LID_R = 0.88, LID_H = 0.42, NECK_H = 0.1;

const jar = new THREE.Group();
scene.add(jar);

// 罐內的辣油果仁
const oil = tex(TEX.oil);
oil.wrapS = oil.wrapT = THREE.RepeatWrapping;
oil.repeat.set(1.2, 2.6);
const contents = new THREE.Mesh(
  new THREE.CylinderGeometry(R * 0.965, R * 0.965, BODY_H - 0.06, 6, 1),
  new THREE.MeshStandardMaterial({ map: oil, roughness: 0.35, metalness: 0 })
);
contents.rotation.y = Math.PI / 6;
contents.position.y = BODY_H / 2;
contents.castShadow = true;
jar.add(contents);

// 六面標籤：0 正面，1 右（營養標示），5 左（成分），2/3/4 背面
const faceTex = { 0: TEX.front, 1: TEX.right, 5: TEX.left, 2: TEX.plain, 3: TEX.logo, 4: TEX.plain };
for (let i = 0; i < 6; i++) {
  const th = (i * Math.PI) / 3;
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(R * 0.995, LABEL_H),
    new THREE.MeshStandardMaterial({ map: tex(faceTex[i]), roughness: 0.6, toneMapped: false })
  );
  m.position.set(Math.sin(th) * (APO + 0.004), LABEL_Y, Math.cos(th) * (APO + 0.004));
  m.rotation.y = th;
  jar.add(m);
}

// 玻璃外殼
const glass = new THREE.Mesh(
  new THREE.CylinderGeometry(R * 1.02, R * 1.02, BODY_H, 6, 1),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.04, metalness: 0, transparent: true, opacity: 0.08, clearcoat: 1, envMapIntensity: 1.2, depthWrite: false })
);
glass.rotation.y = Math.PI / 6;
glass.position.y = BODY_H / 2;
jar.add(glass);

// 瓶口
const neck = new THREE.Mesh(
  new THREE.CylinderGeometry(LID_R * 0.92, R * 0.9, NECK_H, 48),
  new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.05, transparent: true, opacity: 0.25, depthWrite: false })
);
neck.position.y = BODY_H + NECK_H / 2;
jar.add(neck);

// 黑色旋蓋（側邊有直紋）
const lidGeo = new THREE.CylinderGeometry(LID_R, LID_R, LID_H, 180, 1, false);
const p = lidGeo.attributes.position;
for (let i = 0; i < p.count; i++) {
  const x = p.getX(i), z = p.getZ(i), r = Math.hypot(x, z);
  if (r > LID_R * 0.98) { const a = Math.atan2(z, x), k = 1 + 0.012 * Math.cos(a * 90); p.setX(i, x * k); p.setZ(i, z * k); }
}
lidGeo.computeVertexNormals();
const lid = new THREE.Mesh(lidGeo, new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.45, metalness: 0.1 }));
lid.position.y = BODY_H + NECK_H + LID_H / 2;
lid.castShadow = true;
jar.add(lid);
const lidTop = new THREE.Mesh(new THREE.CircleGeometry(LID_R * 0.93, 64), new THREE.MeshStandardMaterial({ color: 0x1d1d1d, roughness: 0.3 }));
lidTop.rotation.x = -Math.PI / 2;
lidTop.position.y = BODY_H + NECK_H + LID_H + 0.002;
jar.add(lidTop);

const TOTAL_H = BODY_H + NECK_H + LID_H;
jar.position.y = 0;

// 地面陰影
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.22 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const key = new THREE.DirectionalLight(0xfff1e0, 1.7);
key.position.set(3, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = key.shadow.camera.bottom = -3;
key.shadow.camera.right = key.shadow.camera.top = 3;
key.shadow.radius = 6;
scene.add(key);
scene.add(new THREE.AmbientLight(0xffffff, 0.35));

const target = new THREE.Vector3(0, TOTAL_H * 0.47, 0);
controls.target.copy(target);
const DIST = 6.4, ELEV = 0.18;
function camFor(theta) {
  return new THREE.Vector3(Math.sin(theta) * DIST * Math.cos(ELEV), target.y + DIST * Math.sin(ELEV), Math.cos(theta) * DIST * Math.cos(ELEV));
}
camera.position.copy(camFor(0));

// ---- 面向切換 ----
let tween = null;
const faceBtns = [...document.querySelectorAll("[data-face]")];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
faceBtns.forEach((b) => b.addEventListener("click", () => {
  faceBtns.forEach((x) => x.setAttribute("aria-pressed", x === b));
  setSpin(false);
  const i = +b.dataset.face, th = (i * Math.PI) / 3;
  const from = camera.position.clone().sub(target);
  const r0 = from.length(), a0 = Math.atan2(from.x, from.z), y0 = from.y;
  let a1 = th; while (a1 - a0 > Math.PI) a1 -= Math.PI * 2; while (a1 - a0 < -Math.PI) a1 += Math.PI * 2;
  const end = camFor(th).sub(target);
  tween = { t: 0, dur: reduce ? 1 : 700, a0, a1, r0, r1: DIST, y0, y1: end.y, start: performance.now() };
}));
const spinBtn = document.getElementById("btnSpin");
function setSpin(v) { controls.autoRotate = v; spinBtn.setAttribute("aria-pressed", v); }
spinBtn.addEventListener("click", () => setSpin(!controls.autoRotate));
canvas.addEventListener("pointerdown", () => { tween = null; });

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

renderer.setAnimationLoop((now) => {
  if (tween) {
    const k = Math.min(1, (now - tween.start) / tween.dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const a = tween.a0 + (tween.a1 - tween.a0) * e, y = tween.y0 + (tween.y1 - tween.y0) * e;
    const rh = Math.sqrt(Math.max(0.01, (tween.r0 + (tween.r1 - tween.r0) * e) ** 2 - y * y));
    camera.position.set(target.x + Math.sin(a) * rh, target.y + y, target.z + Math.cos(a) * rh);
    if (k >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
